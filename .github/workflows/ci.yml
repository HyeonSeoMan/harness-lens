name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 테스트는 런타임 의존성이 없다. 커밋된 엔진 번들을 그대로 실행한다.
      - run: node --test tests/*.test.mjs

  # 플랫폼 확인(PRD §5 지원 OS). Linux는 위 test 작업이 맡는다.
  os:
    name: test (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
        shell: bash

  bundle:
    name: committed bundle matches fresh build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
        working-directory: engine
      - run: npm run check-bundle
        working-directory: engine
